name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain preflight
        run: |
          cmake --version
          ctest --version

      - name: Compiler preflight (Linux)
        if: runner.os == 'Linux'
        run: c++ --version

      - name: Secret Scan (Repository)
        run: cmake -DPROJECT_ROOT=. -P scripts/ci-secret-scan.cmake

      - name: Configure (CMake)
        run: cmake --preset ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build --preset ci-build

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset ci-build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --preset ci-test --output-on-failure --timeout 180 -V

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --preset ci-test --output-on-failure --timeout 180 -V

      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            build/ci/Testing/**
            logs/**
